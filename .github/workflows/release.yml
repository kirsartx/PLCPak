name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read AppVersion
        id: version
        shell: pwsh
        run: |
          $file = 'winui/src/PLCPak.Core/AppVersion.cs'
          $match = [regex]::Match((Get-Content -LiteralPath $file -Raw), 'Current\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "AppVersion.Current not found in $file" }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "AppVersion.Current=$version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: winui/global.json

      - name: Publish WinUI dist
        shell: pwsh
        run: |
          & 'winui/scripts/Publish-Release.ps1'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PLCPak v${{ steps.version.outputs.version }} WinUI
          files: releases/PLCPak_v${{ steps.version.outputs.version }}_WinUI.zip
          generate_release_notes: true
